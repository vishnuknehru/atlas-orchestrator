[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "atlas-orchestrator"
version = "0.1.0"
description = "ATLAS — Autonomous Multi-Agent Software Engineering Orchestrator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.10.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "aiosqlite>=0.20.0",
  "structlog>=24.4.0",
  "pyyaml>=6.0.2",
  "python-ulid>=3.0.0",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-sqlite>=3.0.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "hypothesis>=6.120.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "types-PyYAML>=6.0.12",
  "pip-audit>=2.7.3",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/atlas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend/src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S602"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
packages = ["atlas"]
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
